<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Räume</title>
<style>
:root{--bg:#0b1111;--panel:#101a19e6;--line:#24403b;--fg:#e4f3ef;--muted:#8aa39e;--mint:#5eead4;--amber:#fbbf24;--bulb-off:#5d7f9e;--bulb-on:#ffd24a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.chip{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
#title{left:max(14px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));padding:8px 14px}
#title b{font-size:16px}#title span{display:block;color:var(--muted);font-size:12px}
.wip{position:absolute;z-index:5;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid #fbbf2466;border-radius:999px;padding:3px 10px;background:#fbbf2412}
#dock{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 28px));padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.rooms{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rooms::-webkit-scrollbar{display:none}
button{font:inherit;color:var(--fg);background:#ffffff0a;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;min-height:40px}
button:hover,button.on{border-color:var(--mint);color:var(--mint)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.sp{flex:1}
#ctx{flex-wrap:wrap}
.stat{color:var(--muted);font-size:12px;white-space:nowrap}
#pins{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.bulb{position:absolute;left:0;top:0;pointer-events:auto;width:40px;height:40px;padding:0;border-radius:50%;background:#0b1111cc;border:1px solid var(--line);display:grid;place-items:center;color:var(--bulb-off)}
.bulb svg{width:22px;height:22px;fill:currentColor}
.bulb.on{color:var(--bulb-on);border-color:#ffd24a88;box-shadow:0 0 18px #ffd24a66}
.bulb:hover{color:var(--bulb-on)}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;font-size:12px;padding:3px 10px;border-radius:999px;background:#0b1111cc;border:1px solid var(--line);min-height:0}
.lbl.hide{display:none}
.sens{position:absolute;left:0;top:0;pointer-events:auto;font-size:11px;padding:2px 8px 2px 4px;border-radius:999px;background:#0b1111d9;border:1px solid #5eead466;color:var(--fg);min-height:0;display:flex;gap:5px;align-items:center;white-space:nowrap}
.sens i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#5eead422;color:var(--mint);font-size:11px}
.sens span{color:var(--muted)}
.bulb.frei,.sens.frei{border-style:dashed;opacity:.7}
.bulb b{font-size:16px;font-weight:600}
.sens i svg{width:12px;height:12px;fill:currentColor}
.sens.heizt,.bulb.heizt{border-color:#fb923c;box-shadow:0 0 16px #fb923c88}
.sens.heizt i{background:#fb923c33;color:#fb923c}
body.edit .bulb,body.edit .sens{outline:2px dashed #5eead488;outline-offset:2px}
body.edit canvas{cursor:crosshair}
#allBtn{position:fixed;z-index:6;left:max(14px,env(safe-area-inset-left,0px));top:max(122px,calc(env(safe-area-inset-top,0px) + 108px));background:var(--panel)}
#allBtn.on{border-color:var(--mint);color:var(--mint)}
#editBtn{position:fixed;z-index:6;left:max(14px,env(safe-area-inset-left,0px));top:max(78px,calc(env(safe-area-inset-top,0px) + 64px));background:var(--panel)}
#hint{left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top,0px));max-width:min(460px,calc(100% - 28px));padding:8px 14px;font-size:13px;text-align:center;z-index:6;border-color:#5eead466}
#sheet{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));max-height:min(78vh,640px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:7}
#sheet label,#sheet .lab{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}
#sheet input{font:inherit;color:var(--fg);background:#0b1111;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px}
#sheet input:focus{outline:2px solid var(--mint);outline-offset:1px}
#shListe{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto;padding-right:2px}
#shListe .ent{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;white-space:normal;min-height:0;flex:0 0 auto;padding:7px 10px}
#shListe .ent small{color:var(--muted);font-size:11px}
#shListe .ent.on small{color:var(--mint)}
#shListe .leer{margin:4px 2px;color:var(--muted);font-size:12px}
.syms{display:flex;flex-wrap:wrap;gap:6px}
.syms .sym{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:16px}
.syms .sym svg{width:20px;height:20px;fill:currentColor}
[hidden]{display:none!important}
body.schmal #title{left:60px}
@media (max-width:640px){.wip{display:none}.bulb{width:44px;height:44px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="pins"></div>
<div class="chip" id="title"><b>Wohnung</b><span id="sub">Alle Räume</span></div>
<button type="button" id="editBtn" hidden>✎ Punkte</button>
<button type="button" id="allBtn" aria-pressed="false">◉ Alle Punkte zeigen</button>
<div class="chip" id="hint" role="status" hidden></div>
<div class="chip" id="sheet" role="dialog" aria-labelledby="shT" hidden>
  <div class="row"><b id="shT">Neuer Punkt</b><span class="sp"></span><button type="button" id="shX" aria-label="Schließen">✕</button></div>
  <label>Name<input id="shName" maxlength="80" autocomplete="off" placeholder="z. B. Stehlampe"></label>
  <label>Gerät aus Home Assistant<input id="shSuch" type="search" autocomplete="off" placeholder="Suchen nach Name oder entity_id"></label>
  <div id="shListe" role="listbox" aria-label="Geräte"></div>
  <div class="lab">Symbol</div>
  <div class="syms" id="shSym"></div>
  <div class="row"><button type="button" id="shDel">Löschen</button><button type="button" id="shMove">Verschieben</button><span class="sp"></span><button type="button" id="shOk" class="on">Speichern</button></div>
</div>
<div class="wip" id="ver">Räume</div>
<div class="chip" id="dock">
  <div class="row rooms" id="chips"></div>
  <div class="row" id="ctx"></div>
</div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>

    ROOMS.forEach(function(r){
      var want=lampsOn(r)?1:0;r.k+=(want-r.k)*Math.min(1,dt*4);
      r.light.intensity=r.k*.45;
      var dim=cur&&cur!==r;
      r.floorMats.forEach(function(m){m.color.copy(r.base).lerp(r.lit,r.k);m.opacity+=((dim?.55:1)-m.opacity)*Math.min(1,dt*6);});
    });
    var GR={wz:wzGrp,az:azGrp,fl:flGrp,sz:szGrp,bd:bdGrp,ku:kuGrp},cid=cur?(cur.id==='ez'?'wz':cur.id):null;for(var gk in GR)GR[gk].visible=!cid||gk===cid;
    // Lampen im Modell leuchten, wenn ihr Punkt an ist (gelöschte Punkte bleiben aus)
    for(var rk in MATS)for(var mk in MATS[rk]){var mm=MATS[rk][mk];if(mk==='amb')mm.opacity=0;else if(mk==='tv')mm.color.set(0x0b0b0c);else if(mm.color)mm.color.set(0x2a2a2a);}
    PTS.forEach(function(p){if(!p.m||!MATS[p.raum]||!MATS[p.raum][p.m]||!istAn(p))return;var mm=MATS[p.raum][p.m];
      if(p.m==='amb'){mm.color.set(0x6a8cff);mm.opacity=.55;}else if(p.m==='tv')mm.color.set(0x2c4f86);else mm.color.set((FARBE[p.raum]&&FARBE[p.raum][p.m])||0xfff0c8);});
    var w=stage.clientWidth,h=stage.clientHeight;
    function place(el,v,hide){pv.copy(v).project(camera);var vis=!hide&&pv.z<1;el.style.display=vis?'':'none';if(vis)el.style.transform='translate('+((pv.x*.5+.5)*w)+'px,'+((-pv.y*.5+.5)*h)+'px) translate(-50%,-50%)';}
    ROOMS.forEach(function(r){
      pv.set(r.c.x,.05,r.c.z+r.size*.22);
      if(!r.lbl.classList.contains('hide')){place(r.lbl,pv,false);}else r.lbl.style.display='none';
    });
    // Ausgezoomt sieht man keine Punkte. Sie erscheinen, sobald man einen Raum öffnet (oder „Alle Punkte zeigen“ wählt)
    PTS.forEach(function(p){var fremd=cur&&cur.id!==p.raum&&!(cur.id==='wz'&&p.raum==='ez')&&!(cur.id==='ez'&&p.raum==='wz');
      place(p.el,p.v,!(edit||allePunkte||(cur&&!fremd)));p.el.style.opacity=fremd?.35:1;});
    renderer.render(scene,camera);requestAnimationFrame(frame);
  }
  aufbauen();frame();
  senden({type:'raum-ready'});
})();
</script>
